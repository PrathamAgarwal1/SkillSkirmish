# Keeps the free Render server from falling asleep, so visitors don't wait ~1 minute for it to boot.
# Pings /api/health every 10 minutes (Render sleeps a service after 15 idle minutes).
#
# Set the repository variable KEEP_AWAKE_URL (Settings → Secrets and variables → Actions → Variables)
# if your server isn't https://skillskirmish.onrender.com. One always-on service fits in Render's
# 750 free instance-hours a month. GitHub pauses scheduled workflows after 60 days without commits;
# re-enable it from the Actions tab if that happens.
name: Keep server awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the health check
        env:
          URL: ${{ vars.KEEP_AWAKE_URL || 'https://skillskirmish.onrender.com/api/health' }}
        run: |
          curl --fail --silent --show-error --max-time 120 --retry 3 --retry-delay 10 --retry-all-errors "$URL"
          echo
