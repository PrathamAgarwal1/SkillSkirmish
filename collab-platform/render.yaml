services:
  - type: web
    name: skillskirmish-backend
    env: node
    root: collab-platform/server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        value: https://PrathamAgarwal1.github.io
